# sleep-secret 的 F-Droid 元数据
#
# ## 怎么用
#
# 1. Fork https://gitlab.com/fdroid/fdroiddata
# 2. 把本文件放成 `metadata/com.sleepsecret.sleep_secret.yml`
# 3. **把文件里所有注释删掉**（fdroiddata 的模板第一行就写着这个要求）
# 4. 提 MR
#
# ## 构建配方怎么来的
#
# 骨架取自官方的 `templates/build-flutter.yml`，多 ABI 那部分对照了
# 主仓库里真实的 Flutter 应用 `metadata/dev.imranr.obtainium.fdroid.yml`
# （模板和真实例子的写法不完全一致，以真实例子为准）。
#
# ## 两个有意的选择
#
# **1. 用 srclib 引进 Flutter，不用 submodule。**
# 模板支持两种：把 Flutter 加成本仓库的 git submodule，或者用 `srclibs` +
# 手动 checkout。Obtainium 用的是后者之外的那种，但那要往源仓库塞一个几百 MB
# 的 submodule —— **为了让 F-Droid 能构建而改动仓库结构，本末倒置**。
# srclib 方式不用动仓库一个字。
#
# **2. 没加「构建路径舞蹈」。**
# 模板里那套 `export repo=/upstream/path/... && mv ...` 是为了让构建发生在
# 和上游相同的路径上，好让产物逐字节可复现（也就是「开发者签名」那条路）。
# 第一版不追这个 —— 提交后 F-Droid 会用**它自己的密钥**签名。
#
# ## ⚠️ 这份元数据没有跑过
#
# 它只能由 F-Droid 的构建服务器验证。第一次提 MR 大概率要按评审意见调，
# 尤其是 `subdir: app` 和 `output`/`rm` 路径的相对关系。

Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: liuweiqing
SourceCode: https://github.com/14790897/sleep-secret
IssueTracker: https://github.com/14790897/sleep-secret/issues
Changelog: https://github.com/14790897/sleep-secret/releases

AutoName: Sleep Secret

RepoType: git
Repo: https://github.com/14790897/sleep-secret.git

Builds:
  # ---- arm64-v8a（现代手机基本都是这个）----
  - versionName: 2.8.0
    versionCode: 20801
    commit: v2.8.0
    subdir: app
    # Flutter 工程在 app/ 子目录里，所以 workflow 路径要往上一层
    srclibs:
      - flutter@stable
    rm:
      - ../ios
      - ../linux
      - ../macos
      - ../web
      - ../windows
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    prebuild:
      # 从 CI 的 workflow 里读 Flutter 版本 —— 那边是唯一的事实来源，
      # 抄一份到这儿迟早会跟 CI 跑的不是同一个版本
      # 整条用 YAML 单引号包起来：命令里含「冒号 + 空格」，
      # 不包的话 YAML 会把它当成键值分隔符。内层单引号写成两个。
      - 'flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION: ''(.*)''/\1/p" ../.github/workflows/ci.yml)'
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      # PUB_CACHE 指到仓库里，好让扫描器扫到这些 dart 包
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      # --enforce-lockfile：pubspec.lock 是提交进仓库的，
      # 构建不该悄悄换掉任何一个依赖的版本
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      # Flutter 工具自己下载的东西（它不是应用内容）
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

  # ---- armeabi-v7a ----
  - versionName: 2.8.0
    versionCode: 20802
    commit: v2.8.0
    subdir: app
    srclibs:
      - flutter@stable
    rm:
      - ../ios
      - ../linux
      - ../macos
      - ../web
      - ../windows
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    prebuild:
      # 整条用 YAML 单引号包起来：命令里含「冒号 + 空格」，
      # 不包的话 YAML 会把它当成键值分隔符。内层单引号写成两个。
      - 'flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION: ''(.*)''/\1/p" ../.github/workflows/ci.yml)'
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

  # ---- x86_64（模拟器）----
  - versionName: 2.8.0
    versionCode: 20803
    commit: v2.8.0
    subdir: app
    srclibs:
      - flutter@stable
    rm:
      - ../ios
      - ../linux
      - ../macos
      - ../web
      - ../windows
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    prebuild:
      # 整条用 YAML 单引号包起来：命令里含「冒号 + 空格」，
      # 不包的话 YAML 会把它当成键值分隔符。内层单引号写成两个。
      - 'flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION: ''(.*)''/\1/p" ../.github/workflows/ci.yml)'
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-x64"

# 每个 ABI 一个 versionCode：`%c` 是 pubspec 里 `+N` 那个数，
# 乘 10 再加序号。**不这么做的话三个 APK 会撞同一个 versionCode**。
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'

AutoUpdateMode: Version
UpdateCheckMode: Tags
# 版本号从 app/pubspec.yaml 读（Flutter 工程在子目录里，所以带上前缀）
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.8.0
CurrentVersionCode: 20801
