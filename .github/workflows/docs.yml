name: Docs

# 文档站的构建与发布。站点源码就是仓库根下的 `docs/`（同时放着 README 用的截图），
# 所以改到这几处才需要重建；`CHANGELOG.md` 那种内嵌的文件不存在，
# 更新日志直接链 GitHub Releases。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 只 clone + pip install + 构建，不需要写权限。
    # ⚠️ 别把 pages: write 加到这里——只有 deploy 那一层需要。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 别把 token 留在 .git/config 里给构建期的第三方代码读
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 和 FLUTTER_VERSION 一样钉死：本机验证过的就是这个组合，
      # 换版本带来的渲染差异不该混在文档改动里出现
      - name: 安装 mkdocs
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7" "mkdocs-static-i18n==1.3.1"

      # --strict：任何一条告警都让 CI 红。
      # 最常触发的两种是「页面不在 nav 里」和「链接找不到」——
      # 后者尤其要拦：i18n 插件在**缺英文翻译时不报错**，
      # 英文站点会直接渲染中文内容，只能靠别的手段发现（见 README 里的对照命令）。
      - name: 构建
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
