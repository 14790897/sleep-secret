name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连着推两次时，取消掉还在跑的那次，省 runner 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 钉住版本而不是用 latest —— 本机验证的就是这个版本，
  # 换版本带来的差异不该混在业务改动里出现
  FLUTTER_VERSION: '3.47.6'
  # 与本机一致；app/android/app/build.gradle.kts 用的也是 17
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------- 快速反馈
  static:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # 不加 --no-fatal-infos：当前仓库是全干净的，
      # 新引入的风格问题就该在 CI 上被拦住。要修跑 dart fix --apply。
      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  # ---------------------------------------------------------------- 集成测试
  #
  # 跑的是**真实 Android 运行时**：真模型、真数据库、真界面。
  # 需要麦克风的两个测试在 integration_test_hardware/，这里不会碰到它们——
  # 音频由 assets 里的 fixture 回放，不依赖硬件、不联网、时序确定。
  integration:
    name: 集成测试（Android 模拟器）
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # GitHub 托管的 Linux runner 有 /dev/kvm，但默认只有 root 能用。
      # 不放开的话模拟器会退回纯软件模拟，慢到基本跑不完。
      - name: 放开 KVM 权限
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 跑集成测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: app
          disable-animations: true
          script: flutter test integration_test -d emulator-5554

  # ---------------------------------------------------------------- 发布构建
  #
  # 这个项目在 release-only 的 R8 混淆上栽过（ONNX Runtime 的 JNI 按类名找类，
  # 混淆后就 SIGABRT）。虽然跑起来才能验证运行时行为，但至少保证：
  # release 构建本身能过、ProGuard 规则没写坏。
  release-build:
    name: Release 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

# 需要真实麦克风的两个测试不在上面任何一步里，手动跑：
#
#   flutter test integration_test_hardware/microphone_diagnostic_test.dart -d <设备>
#   flutter test integration_test_hardware/capture_mic_fixture_test.dart -d windows \
#     --dart-define=OUT=<路径> --dart-define=SECONDS=30
#
# 前者只测采集电平、不判对错；后者是录 fixture 的工具，会外放声音。
