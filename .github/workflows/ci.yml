name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连着推两次时，取消掉还在跑的那次，省 runner 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 钉住版本而不是用 latest —— 本机验证的就是这个版本，
  # 换版本带来的差异不该混在业务改动里出现
  FLUTTER_VERSION: '3.47.6'
  # 与本机一致；app/android/app/build.gradle.kts 用的也是 17
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------- 快速反馈
  static:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # 不加 --no-fatal-infos：当前仓库是全干净的，
      # 新引入的风格问题就该在 CI 上被拦住。要修跑 dart fix --apply。
      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  # ---------------------------------------------------------------- 集成测试
  #
  # 跑的是**真实 Android 运行时**：真模型、真数据库、真界面。
  # 需要麦克风的两个测试在 integration_test_hardware/，这里不会碰到它们——
  # 音频由 assets 里的 fixture 回放，不依赖硬件、不联网、时序确定。
  integration:
    name: 集成测试（Android 模拟器）
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # GitHub 托管的 Linux runner 有 /dev/kvm，但默认只有 root 能用。
      # 不放开的话模拟器会退回纯软件模拟，慢到基本跑不完。
      - name: 放开 KVM 权限
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 跑集成测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: app
          disable-animations: true
          # 跑聚合入口 `all_tests.dart`，而不是整个目录。
          #
          # `flutter test integration_test`（目录形式）会为**每个测试文件**
          # 单独构建并安装一次 APK（集成测试的入口就是测试文件本身），
          # 5 个文件就是 5 轮「Gradle 构建 → adb 安装 → 启动 → 卸载」。
          # 实测在 GitHub 托管的模拟器上，第 2 轮构建时模拟器就挂了
          # （adb: device 'emulator-5554' not found），后面全部失败，
          # 而且整个 job 拖到 13 分钟以上。
          #
          # 聚合入口是**一次构建、一次安装、一次启动**：
          # 本地实测 44 秒跑完 24 个测试，目录形式要 2.5 分钟。
          #
          # 这里也不需要预先授予录音权限，因为 integration_test/ 里的测试
          # 都不碰真实麦克风——音频由 assets 的 fixture 回放。
          # 需要真麦克风和已授权限的测试都在 integration_test_hardware/。
          script: flutter test integration_test/all_tests.dart -d emulator-5554

  # ---------------------------------------------------------------- Windows 桌面版
  #
  # 桌面版是**跑得起来的**，所以这里让它真的跑一遍，而不是只构建。
  #
  # 为什么值得多花这几分钟：桌面这条路径和 Android 有几处**实质不同**——
  #   - 数据库走 sqflite_common_ffi（不是 Android 的原生 SQLite）
  #   - 导出目录走普通路径（不是 SAF）
  #   - 前台服务降级成空实现（flutter_foreground_task 不支持 Windows）
  # 只构建不运行的话，这三处都验证不到。
  #
  # 跑的是同一个聚合入口、同一批测试。音频仍然是 fixture 回放，
  # 不碰真麦克风（那几个在 integration_test_hardware/）。
  windows:
    name: 集成测试（Windows 桌面）
    runs-on: windows-latest
    needs: static
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # ⚠️ 这条能不能在托管 runner 上跑起来，取决于**有没有可用的桌面会话**。
      # 需要窗口才能建出来的东西会在这里失败——失败了看日志确认是环境问题
      # 还是代码问题，别直接删掉这一步。
      #
      # 本机（Windows 11）实测整条 26 个测试约 40 秒跑完。
      - name: 跑集成测试
        run: flutter test integration_test/all_tests.dart -d windows

  # ---------------------------------------------------------------- 发布构建
  #
  # 这个项目在 release-only 的 R8 混淆上栽过（ONNX Runtime 的 JNI 按类名找类，
  # 混淆后就 SIGABRT）。虽然跑起来才能验证运行时行为，但至少保证：
  # release 构建本身能过、ProGuard 规则没写坏。
  release-build:
    name: Release 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

# 需要真实麦克风（以及已授予的录音权限）的三个测试不在上面任何一步里，
# 在真机/本地手动跑：
#
#   flutter test integration_test_hardware/microphone_diagnostic_test.dart -d <设备>
#   flutter test integration_test_hardware/real_recorder_flow_test.dart -d <设备>
#   flutter test integration_test_hardware/capture_mic_fixture_test.dart -d windows \
#     --dart-define=OUT=<路径> --dart-define=SECONDS=30
#
# 前两个需要设备上已授予录音权限；
# 第三个是录 fixture 的工具，会外放声音。
