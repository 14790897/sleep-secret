name: Release

# 每次推到 main 都会跑，但**只有**当提交里出现了该发版的类型时才会真的发：
#
#   fix:      -> patch（1.0.0 -> 1.0.1）
#   feat:     -> minor（1.0.0 -> 1.1.0）
#   BREAKING CHANGE: -> major（1.0.0 -> 2.0.0）
#
# 其余提交（chore/docs/refactor/test/style 等）不会触发发版，直接退出。
# 也就是说：**提交信息必须遵守 Conventional Commits**，否则这个 workflow
# 永远不会有任何动作——而且不会报错，只是静默地什么都不做。
on:
  push:
    branches: [main]
  workflow_dispatch:

# semantic-release 要创建 tag、GitHub Release、往 main 推版本提交
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  # 发版不能并行，也不能被打断——中途取消会留下只有 tag 没有产物的半成品
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'
  # 用 24 而不是钉死小版本：@semantic-release/git 要求 >=24.15
  NODE_VERSION: '24'
  # release keystore 的证书指纹。scripts/build_release_apk.sh 会拿它校验
  # 构建出来的 APK，不一致就让发版失败。
  #
  # 这不是密钥，是公钥指纹，写在这里没有安全问题。它防的是：
  # 万一 key.properties 没还原成功，Gradle 会**静默退回 debug 签名**
  # 照常出包——那种包用户装不上，而且要靠卸载重装才能恢复。
  #
  # 换密钥时记得同步改这里，并想清楚代价（见 scripts/build_release_apk.sh）。
  EXPECTED_CERT_SHA256: '8b8a54d2dbd72a6ee94202e790e48c1bf1a817e10d2e13b3e8a347b6a2519521'

jobs:
  release:
    name: 语义化发版 + 构建 APK
    runs-on: ubuntu-latest
    # 给下面的 Windows job 用：这次到底发版了没有、发的是哪个 tag。
    # 空字符串表示没发版（提交里没有该发版的类型），Windows job 会跳过。
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release 要读**完整的**提交历史和所有 tag 才能算版本，
          # 默认的浅克隆会让它算错或者直接不发版
          fetch-depth: 0
          # 让 @semantic-release/git 用 GITHUB_TOKEN 自己推，
          # 而不是用 checkout 留下的凭据
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 装 semantic-release
        run: npm ci

      - name: 装 Flutter 依赖
        working-directory: app
        run: flutter pub get

      # ⚠️ 这把钥匙就是**这个应用的身份**。换掉它，已经装过旧版的用户
      # 就无法覆盖安装，只能卸载重装——那会清掉全部睡眠历史。
      # Secrets 里存了一份，本机 app/android/ 下也留了一份，两边都要保管好。
      - name: 还原签名用的 keystore
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 没配置，无法给 release 包签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > sleep-secret-release.jks
          {
            echo "storeFile=sleep-secret-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "keystore 已还原（$(wc -c < sleep-secret-release.jks) 字节）"

      # ⚠️ 发版跑着的时候**不要再推 main**。
      #
      # semantic-release 会在最后把版本提交（改过的 pubspec.yaml）推回 main。
      # 如果这中间 main 前进了，推送会被拒（`! [rejected] HEAD -> main (fetch first)`），
      # 而那时 tag 可能已经建了——留下一个只有 tag 没有产物的半成品。
      #
      # 下面这道检查能挡掉「排队中的 run」这种常见情况（连推两次 → 两个 run 排队）：
      # 如果本地 HEAD 已经不是 main 的最新提交，说明有更新的 push 在等着，
      # 那次 push 触发的 run 会负责发版，这次跳过。
      #
      # 挡不住的是「run 已经开始、构建途中 main 又前进」——那只能靠重跑。
      #
      # ⚠️ 两个坑，都踩过：
      #   1. 不能用 `git fetch` 查——checkout 设了 persist-credentials: false，
      #      没有凭据，会以 `could not read Username` 失败，
      #      而这步失败会**直接跳过发版**（安全网反而卡死了发版）。
      #   2. 这是优化不是安全闸，所以任何异常都要**放行**，
      #      不能因为查不到就把该发的版挡掉。
      - name: 检查 main 有没有前进
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha 2>/dev/null) || {
            echo "查不到 main 的最新提交，跳过这项检查继续发版"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "main 已经前进到 ${REMOTE:0:7}（本次 run 基于 ${LOCAL:0:7}）"
            echo "跳过本次发版——那次 push 触发的 run 会处理"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "main 没有前进，继续发版"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 这一步会依次做：
      #   1. 分析提交，算出下一个版本号
      #   2. 生成 release notes
      #   3. prepareCmd：把版本写进 app/pubspec.yaml，构建 APK 并校验签名
      #   4. 把 pubspec.yaml 的改动作为 chore(release): x.y.z [skip ci] 推回 main
      #   5. 创建 GitHub Release，把 APK 挂上去
      - name: 发版
        id: publish
        if: steps.freshness.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 发版前后各取一次最新 tag，比出这次到底发没发、发的是哪个。
          # 不能用「有没有新 tag」直接判断——没发版时 get describe 会返回上一个 tag。
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          npx semantic-release

          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then
            echo "本次发布了 $AFTER"
            echo "tag=$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "本次没有发版（提交里没有 feat/fix/BREAKING CHANGE 这类）"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- Windows 桌面版
  #
  # 单独一个 job，因为 **Flutter 的 Windows 桌面版没法在 Linux 上构建**，
  # 而发版 job 跑在 ubuntu 上。
  #
  # 排在发版**之后**、并认准刚创建的那个 tag，是为了让包里的版本号是对的——
  # 发版会把新版本写进 pubspec.yaml，tag 就指向那个提交。
  # 如果和发版并行跑，构建时拿到的还是旧版本号。
  #
  # ⚠️ 这个包是**开发/测试用途**，不是日常使用的客户端：
  # flutter_foreground_task 不支持 Windows（代码里降级处理了），
  # 所以它没有「前台服务保活」这回事，只适合短时试用。
  # 这一点在包里附的 README.txt 里也写了。
  windows:
    name: Windows 桌面版（测试用途）
    runs-on: windows-latest
    needs: release
    # 没发版就没什么可挂的，跳过
    if: needs.release.outputs.tag != ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 装 Flutter 依赖
        working-directory: app
        run: flutter pub get

      - name: 构建 Windows 桌面版
        working-directory: app
        run: flutter build windows --release

      - name: 打包并附上说明
        shell: pwsh
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $src = "app/build/windows/x64/runner/Release"
          $zip = "sleep-secret-windows-$env:TAG.zip"

          $note = @"
          这个包是「开发 / 测试用途」。

          整夜录音**可以**用，条件只有一个：**插着电**。
          Windows 上不需要 Android 那种前台服务（它防的是系统杀后台，
          而 Windows 不杀正在运行的应用），唯一的风险是系统休眠。
          请把电源计划设成「从不休眠」，或直接插电 —— 插电时大多数机器
          本来就设成不休眠。

          关掉屏幕不影响录音。

          构建自 $env:TAG
          "@
          Set-Content -Path "$src\README.txt" -Value $note -Encoding UTF8

          Compress-Archive -Path "$src\*" -DestinationPath $zip
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "已打包 $zip （$mb MB）"

      - name: 挂到 Release 上
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$env:TAG" "sleep-secret-windows-$env:TAG.zip" --clobber
