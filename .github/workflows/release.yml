name: Release

# 每次推到 main 都会跑，但**只有**当提交里出现了该发版的类型时才会真的发：
#
#   fix:      -> patch（1.0.0 -> 1.0.1）
#   feat:     -> minor（1.0.0 -> 1.1.0）
#   BREAKING CHANGE: -> major（1.0.0 -> 2.0.0）
#
# 其余提交（chore/docs/refactor/test/style 等）不会触发发版，直接退出。
# 也就是说：**提交信息必须遵守 Conventional Commits**，否则这个 workflow
# 永远不会有任何动作——而且不会报错，只是静默地什么都不做。
on:
  push:
    branches: [main]
  workflow_dispatch:

# semantic-release 要创建 tag、GitHub Release、往 main 推版本提交
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  # 发版不能并行，也不能被打断——中途取消会留下只有 tag 没有产物的半成品
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'
  # 用 24 而不是钉死小版本：@semantic-release/git 要求 >=24.15
  NODE_VERSION: '24'
  # release keystore 的证书指纹。scripts/build_release_apk.sh 会拿它校验
  # 构建出来的 APK，不一致就让发版失败。
  #
  # 这不是密钥，是公钥指纹，写在这里没有安全问题。它防的是：
  # 万一 key.properties 没还原成功，Gradle 会**静默退回 debug 签名**
  # 照常出包——那种包用户装不上，而且要靠卸载重装才能恢复。
  #
  # 换密钥时记得同步改这里，并想清楚代价（见 scripts/build_release_apk.sh）。
  EXPECTED_CERT_SHA256: '8b8a54d2dbd72a6ee94202e790e48c1bf1a817e10d2e13b3e8a347b6a2519521'

jobs:
  release:
    name: 语义化发版 + 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release 要读**完整的**提交历史和所有 tag 才能算版本，
          # 默认的浅克隆会让它算错或者直接不发版
          fetch-depth: 0
          # 让 @semantic-release/git 用 GITHUB_TOKEN 自己推，
          # 而不是用 checkout 留下的凭据
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 装 semantic-release
        run: npm ci

      - name: 装 Flutter 依赖
        working-directory: app
        run: flutter pub get

      # ⚠️ 这把钥匙就是**这个应用的身份**。换掉它，已经装过旧版的用户
      # 就无法覆盖安装，只能卸载重装——那会清掉全部睡眠历史。
      # Secrets 里存了一份，本机 app/android/ 下也留了一份，两边都要保管好。
      - name: 还原签名用的 keystore
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 没配置，无法给 release 包签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > sleep-secret-release.jks
          {
            echo "storeFile=sleep-secret-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "keystore 已还原（$(wc -c < sleep-secret-release.jks) 字节）"

      # ⚠️ 发版跑着的时候**不要再推 main**。
      #
      # semantic-release 会在最后把版本提交（改过的 pubspec.yaml）推回 main。
      # 如果这中间 main 前进了，推送会被拒（`! [rejected] HEAD -> main (fetch first)`），
      # 而那时 tag 可能已经建了——留下一个只有 tag 没有产物的半成品。
      #
      # 下面这道检查能挡掉「排队中的 run」这种常见情况（连推两次 → 两个 run 排队）：
      # 如果本地 HEAD 已经不是 main 的最新提交，说明有更新的 push 在等着，
      # 那次 push 触发的 run 会负责发版，这次跳过。
      #
      # 挡不住的是「run 已经开始、构建途中 main 又前进」——那只能靠重跑。
      #
      # ⚠️ 两个坑，都踩过：
      #   1. 不能用 `git fetch` 查——checkout 设了 persist-credentials: false，
      #      没有凭据，会以 `could not read Username` 失败，
      #      而这步失败会**直接跳过发版**（安全网反而卡死了发版）。
      #   2. 这是优化不是安全闸，所以任何异常都要**放行**，
      #      不能因为查不到就把该发的版挡掉。
      - name: 检查 main 有没有前进
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha 2>/dev/null) || {
            echo "查不到 main 的最新提交，跳过这项检查继续发版"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "main 已经前进到 ${REMOTE:0:7}（本次 run 基于 ${LOCAL:0:7}）"
            echo "跳过本次发版——那次 push 触发的 run 会处理"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "main 没有前进，继续发版"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 这一步会依次做：
      #   1. 分析提交，算出下一个版本号
      #   2. 生成 release notes
      #   3. prepareCmd：把版本写进 app/pubspec.yaml，构建 APK 并校验签名
      #   4. 把 pubspec.yaml 的改动作为 chore(release): x.y.z [skip ci] 推回 main
      #   5. 创建 GitHub Release，把 APK 挂上去
      - name: 发版
        if: steps.freshness.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
